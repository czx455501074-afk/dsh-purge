# dsh-purge-czx bundle patch
#
# 只做两件事：清洗宿主补丁 + 系统提示注入。演练台（lib/redteam、presets/redteam、
# skills/redteam）已在 2.2.0 移除，本文件不再注册任何红队模块。

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.

- id: dsh-purge-czx
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge-czx
      name: 'dsh-purge-czx'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true
        approvalBypass: true
